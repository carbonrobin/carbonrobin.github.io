<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crazy Joe Event Reports</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background:#071522; color:#eaf7ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 15% 0%,#12314c 0,transparent 35%),#071522; }
    main { max-width:1200px; margin:32px auto; padding:0 20px 40px; }
    header, .toolbar, section { background:#0d1d2b; border:1px solid #28465b; border-radius:16px; box-shadow:0 12px 30px #0005; }
    header { padding:24px; margin-bottom:18px; }
    h1 { margin:0 0 8px; font-size:clamp(1.8rem,4vw,2.7rem); }
    header p { margin:0; color:#a7bfd3; }
    .toolbar { padding:14px; display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:18px; }
    label { font-weight:700; }
    select, button { color:#eaf7ff; background:#142a3a; border:1px solid #42627a; border-radius:8px; padding:10px 12px; font:inherit; }
    button { cursor:pointer; font-weight:700; }
    button:hover, select:focus { border-color:#66d7ff; }
    #status { color:#a7bfd3; margin-left:auto; }
    section { overflow:hidden; margin-bottom:14px; }
    h2 { font-size:1.1rem; margin:0; padding:13px 16px; background:#14344a; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:650px; }
    th,td { text-align:left; padding:10px 12px; border-bottom:1px solid #28465b; }
    th { color:#a7bfd3; font-size:.8rem; text-transform:uppercase; }
    tr:hover td { background:#ffffff0a; }
    .empty { color:#a7bfd3; padding:24px; text-align:center; }
    @media print { :root { color-scheme:light; color:#111; background:white; } body { background:white; } main { margin:0; max-width:none; } header,section { box-shadow:none; border-color:#bbb; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Crazy Joe Event Report</h1>
      <p>Whiteout Survival · Alliance 105 · State 2556</p>
    </header>
    <div class="toolbar" aria-label="Report controls">
      <label for="reportSelect">Report</label>
      <select id="reportSelect" aria-label="Select a CSV report"></select>
      <label for="statusFilter">Status</label>
      <select id="statusFilter">
        <option value="all">All</option><option value="online">Online</option><option value="offline">Offline</option><option value="no response">No Response</option>
      </select>
      <label for="sortSelect">Sort</label>
      <select id="sortSelect">
        <option value="power-desc">Strongest First</option><option value="power-asc">Weakest First</option><option value="name">Name A–Z</option>
      </select>
      <button id="downloadCsv" type="button">Download CSV</button>
      <button id="printReport" type="button">Print</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
    <div id="report"></div>
  </main>
<script>
  const reportSelect = document.getElementById('reportSelect');
  const statusFilter = document.getElementById('statusFilter');
  const sortSelect = document.getElementById('sortSelect');
  const statusEl = document.getElementById('status');
  const reportEl = document.getElementById('report');
  let records = [];
  let selectedCsv = '';

  function parseCSV(text) {
    const rows = [];
    let row = [], cell = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === '"') {
        if (quoted && text[i + 1] === '"') { cell += '"'; i++; }
        else quoted = !quoted;
      } else if (ch === ',' && !quoted) { row.push(cell.trim()); cell = ''; }
      else if ((ch === '\n' || ch === '\r') && !quoted) {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell.trim());
        if (row.some(value => value !== '')) rows.push(row);
        row = []; cell = '';
      } else cell += ch;
    }
    if (cell || row.length) { row.push(cell.trim()); rows.push(row); }
    const headers = rows.shift() || [];
    return rows.map(values => Object.fromEntries(headers.map((key, index) => [key, values[index] || ''])));
  }

  function statusOf(value) {
    const status = String(value || '').toLowerCase();
    if (status.includes('no response')) return 'no response';
    if (status.includes('offline')) return 'offline';
    if (status.includes('online')) return 'online';
    return 'unknown';
  }

  function render() {
    const filter = statusFilter.value;
    let visible = records.filter(record => filter === 'all' || statusOf(record['Online / Offline']) === filter);
    const power = record => Number(String(record.Power || '').replace(/[^0-9.-]/g, '')) || 0;
    if (sortSelect.value === 'power-desc') visible.sort((a,b) => power(b)-power(a));
    if (sortSelect.value === 'power-asc') visible.sort((a,b) => power(a)-power(b));
    if (sortSelect.value === 'name') visible.sort((a,b) => (a.Name || '').localeCompare(b.Name || ''));
    const groups = visible.reduce((result, record) => {
      const group = record.Group || 'Unknown';
      (result[group] ||= []).push(record);
      return result;
    }, {});
    reportEl.innerHTML = Object.entries(groups).sort(([a],[b]) => a.localeCompare(b)).map(([group, players]) => `
      <section><h2>${escapeHtml(group)} <small>· ${players.length} players</small></h2><div class="table-wrap"><table>
      <thead><tr><th>Name</th><th>Rank</th><th>Power</th><th>Marches</th><th>Status</th></tr></thead>
      <tbody>${players.map(player => `<tr><td>${escapeHtml(player.Name || '—')}</td><td>${escapeHtml(player.Rank || '—')}</td><td>${escapeHtml(player.Power || '—')}</td><td>${escapeHtml(player.Marches || '—')}</td><td>${escapeHtml(player['Online / Offline'] || '—')}</td></tr>`).join('')}</tbody>
      </table></div></section>`).join('') || '<div class="empty">No players match this filter.</div>';
    statusEl.textContent = `${visible.length} players · ${reportSelect.selectedOptions[0]?.textContent || ''}`;
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  }

  async function loadReport(filename) {
    selectedCsv = filename;
    statusEl.textContent = 'Loading report…';
    reportEl.innerHTML = '';
    try {
      const response = await fetch(encodeURIComponent(filename));
      if (!response.ok) throw new Error(`Could not load ${filename} (${response.status})`);
      records = parseCSV(await response.text());
      render();
    } catch (error) {
      statusEl.textContent = error.message;
      reportEl.innerHTML = '<div class="empty">Unable to load this report.</div>';
    }
  }

  async function initialize() {
    try {
      // GitHub Pages does not provide directory listings, so discover CSVs from the public repo contents API.
      const response = await fetch('https://api.github.com/repos/carbonrobin/carbonrobin.github.io/contents/reports');
      if (!response.ok) throw new Error(`Could not list reports (${response.status})`);
      const files = (await response.json()).filter(file => file.type === 'file' && file.name.toLowerCase().endsWith('.csv'));
      files.sort((a,b) => b.name.localeCompare(a.name));
      if (!files.length) throw new Error('No CSV reports found.');
      reportSelect.replaceChildren(...files.map(file => new Option(file.name, file.name)));
      const preferred = files.find(file => file.name === '2556-105-cj-20260211.csv') || files[0];
      reportSelect.value = preferred.name;
      await loadReport(preferred.name);
    } catch (error) {
      statusEl.textContent = error.message;
      reportEl.innerHTML = '<div class="empty">Unable to find or load report files.</div>';
    }
  }

  reportSelect.addEventListener('change', () => loadReport(reportSelect.value));
  statusFilter.addEventListener('change', render);
  sortSelect.addEventListener('change', render);
  document.getElementById('printReport').addEventListener('click', () => window.print());
  document.getElementById('downloadCsv').addEventListener('click', () => {
    if (selectedCsv) { const link = document.createElement('a'); link.href = encodeURIComponent(selectedCsv); link.download = selectedCsv; link.click(); }
  });
  initialize();
</script>
</body>
</html>
