<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whiteout Survival Reports</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #071522;
      color: #eaf7ff;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at 15% 0%, #12314c 0, transparent 35%), #071522;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    main {
      width: min(900px, calc(100% - 32px));
      background: #0d1d2b;
      border: 1px solid #28465b;
      border-radius: 16px;
      box-shadow: 0 12px 30px #0005;
      padding: 32px 24px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }
    li a {
      display: block;
      padding: 14px 16px;
      border: 1px solid #42627a;
      border-radius: 10px;
      background: #142a3a;
      color: #eaf7ff;
      text-decoration: none;
      font-weight: 700;
    }
    li a:hover {
      border-color: #66d7ff;
      background: #1a3042;
    }
    p {
      margin-top: 20px;
      color: #a7bfd3;
    }
  </style>
</head>
<body>
  <main>
    <h1>Whiteout Survival Reports</h1>
    <ul>
      <li><a href="cj.html">Crazy Joe</a></li>
    </ul>
  </main>
</body>
</html>
