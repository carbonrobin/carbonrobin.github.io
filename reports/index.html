<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crazy Joe Event Report</title>
  <style>
    :root {
      --bg-deep: #040d18;
      --bg-mid: #0b1d2d;
      --bg-ice: #12314c;
      --panel: rgba(12, 24, 37, 0.9);
      --panel-alt: rgba(17, 33, 51, 0.9);
      --card: #0f1d2a;
      --card-soft: rgba(16, 33, 49, 0.88);
      --ink: #eaf7ff;
      --muted: #a7bfd3;
      --line: rgba(145, 181, 210, 0.23);
      --line-strong: rgba(157, 201, 229, 0.4);
      --blue: #66d7ff;
      --cyan: #5ce1e6;
      --sky: #7ec8ff;
      --blue-deep: #1b5ac8;
      --green: #6ce0b3;
      --orange: #ffbf69;
      --red: #ff6b7a;
      --purple: #8b7dff;
      --gold: #f8d66d;
      --gold-2: #f4b942;
      --shadow: 0 20px 45px rgba(3, 9, 17, 0.45);
      --frost: rgba(255,255,255,0.16);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(108, 224, 255, 0.18), transparent 25%),
        radial-gradient(circle at 80% 15%, rgba(91, 144, 255, 0.12), transparent 30%),
        linear-gradient(180deg, #05131d 0%, #0a1a2b 25%, #0d1f2f 100%);
      color: var(--ink);
    }

    .container {
      max-width: 1450px;
      margin: 28px auto;
      padding: 0 20px 36px;
    }

    .topbar {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(11, 28, 42, 0.96), rgba(11, 30, 48, 0.96) 55%, rgba(12, 39, 58, 0.92)),
        linear-gradient(120deg, rgba(255,255,255,0.06), rgba(255,255,255,0));
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px 28px 22px;
      color: white;
      margin-bottom: 22px;
      border: 1px solid var(--line-strong);
    }

    .topbar::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 10% 20%, rgba(164, 230, 255, 0.18), transparent 16%),
        radial-gradient(circle at 80% 25%, rgba(167, 209, 255, 0.12), transparent 18%),
        linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.04) 50%, transparent 100%);
      pointer-events: none;
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      font-size: 0.74rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 12px;
      font-weight: 800;
    }

    .title-row {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 4vw, 3.15rem);
      line-height: 1.05;
      letter-spacing: 0.02em;
      color: #f0f8ff;
      text-shadow: 0 0 18px rgba(128, 196, 255, 0.28);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .meta-pill {
      background: rgba(100, 130, 157, 0.18);
      border: 1px solid rgba(147, 205, 255, 0.28);
      color: #dff4ff;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: rgba(10, 24, 38, 0.74);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px;
      box-shadow: var(--shadow);
    }

    .chip {
      background: rgba(20, 42, 58, 0.9);
      border: 1px solid rgba(142, 195, 224, 0.25);
      color: var(--muted);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.02em;
    }

    .chip.active {
      background: linear-gradient(135deg, var(--blue-deep), var(--cyan));
      color: #02151f;
      border-color: rgba(255,255,255,0.15);
      box-shadow: 0 10px 18px rgba(93, 190, 255, 0.28);
    }

    .select-wrap {
      background: rgba(13, 27, 39, 0.85);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 12px;
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.18);
    }

    select {
      border: none;
      background: transparent;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--ink);
      outline: none;
      padding-right: 10px;
      cursor: pointer;
    }

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .button {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 18px rgba(13, 19, 31, 0.22);
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .download-btn {
      background: linear-gradient(135deg, var(--green), #3bd7a2);
      color: #062a20;
    }

    .print-btn {
      background: linear-gradient(135deg, #b48cff, #7e8ef7);
      color: #ffffff;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .summary-card {
      background: linear-gradient(180deg, rgba(14, 29, 42, 0.96), rgba(11, 25, 38, 0.94));
      border: 1px solid var(--line);
      border-left: 4px solid var(--blue);
      border-radius: 18px;
      padding: 18px 18px 14px;
      box-shadow: 0 12px 26px rgba(6, 19, 30, 0.22);
    }

    .summary-card:nth-child(2) { border-left-color: var(--purple); }
    .summary-card:nth-child(3) { border-left-color: var(--green); }
    .summary-card:nth-child(4) { border-left-color: var(--gold); }

    .summary-card .label {
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    .summary-card .value {
      margin-top: 8px;
      font-size: clamp(1.5rem, 2vw, 2.05rem);
      font-weight: 900;
      color: #f5fbff;
      text-shadow: 0 0 12px rgba(121, 200, 255, 0.2);
    }

    .chart-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 22px;
      margin-bottom: 22px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(14, 29, 42, 0.96), rgba(10, 20, 31, 0.94));
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 16px 32px rgba(4, 10, 16, 0.28);
      overflow: hidden;
    }

    .panel-header {
      background: linear-gradient(135deg, rgba(19, 41, 62, 0.9), rgba(18, 54, 76, 0.9));
      border-bottom: 1px solid var(--line);
      padding: 16px 18px;
      font-weight: 900;
      color: #edf9ff;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .leaderboard {
      padding: 18px;
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .leader-item {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 8px;
      border-bottom: 1px solid rgba(164, 192, 215, 0.14);
    }

    .leader-item:last-child {
      border-bottom: none;
    }

    .rank-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.76rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold), #ffe6a4);
      color: #433400;
      box-shadow: 0 8px 18px rgba(248, 214, 109, 0.25);
    }

    .leader-name {
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #edf7ff;
    }

    .leader-power {
      font-weight: 900;
      color: var(--blue);
      letter-spacing: 0.02em;
    }

    .bar-chart {
      padding: 18px;
    }

    .chart-row {
      display: grid;
      grid-template-columns: 80px 1fr 70px;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .chart-label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 800;
    }

    .bar-shell {
      position: relative;
      height: 18px;
      border-radius: 999px;
      background: rgba(151, 197, 224, 0.14);
      overflow: hidden;
      border: 1px solid rgba(157, 201, 229, 0.12);
    }

    .bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      border-radius: inherit;
      box-shadow: 0 0 18px rgba(102, 215, 255, 0.35);
    }

    .chart-value {
      text-align: right;
      font-size: 0.8rem;
      font-weight: 900;
      color: #eaf7ff;
    }

    .group-block {
      background: linear-gradient(180deg, rgba(14, 29, 42, 0.96), rgba(10, 20, 31, 0.94));
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 22px;
      box-shadow: 0 16px 30px rgba(5, 12, 18, 0.2);
    }

    .group-header {
      background: linear-gradient(135deg, rgba(17, 48, 68, 0.96), rgba(20, 62, 82, 0.96));
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .group-header h2 {
      margin: 0;
      font-size: 1.2rem;
      color: #ebf8ff;
      letter-spacing: 0.03em;
    }

    .players-table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(168, 206, 231, 0.14);
      font-size: 0.96rem;
      vertical-align: top;
      word-break: break-word;
      color: #edf8ff;
    }

    th {
      background: rgba(146, 180, 206, 0.07);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 900;
    }

    tr:hover td {
      background: rgba(124, 168, 202, 0.05);
    }

    .online { color: var(--green); font-weight: 900; }
    .offline { color: var(--red); font-weight: 900; }
    .unknown { color: var(--orange); font-weight: 900; }

    .rank-bubble {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(248,214,109,0.18), rgba(255,255,255,0.08));
      border: 1px solid rgba(248,214,109,0.28);
      font-weight: 900;
      font-size: 0.76rem;
      color: #f9f7ff;
    }

    .group-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #1d2c16;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(248, 214, 109, 0.22);
    }

    .empty-state {
      padding: 30px 18px;
      color: var(--muted);
      text-align: center;
      font-weight: 800;
    }

    @media (max-width: 900px) {
      .chart-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 700px) {
      .toolbar {
        align-items: stretch;
      }

      .controls, .action-row {
        width: 100%;
      }

      .action-row {
        justify-content: flex-start;
      }
    }

    @media print {
      body {
        background: white;
      }
      .button, .toolbar {
        display: none !important;
      }
      .container {
        max-width: 100%;
        margin: 0;
        padding: 0;
      }
      .group-block, .panel, .summary-card {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="eyebrow">Whiteout Survival</div>
      <div class="title-row">
        <div>
          <h1>Crazy Joe Event Report</h1>
          <div class="meta">
            <span class="meta-pill">Alliance: 105</span>
            <span class="meta-pill">State: 2556</span>
            <span class="meta-pill">Date: February 11, 2026</span>
          </div>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <div class="controls">
        <div class="chip-group" id="statusFilters" aria-label="Status filter">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="online">Online</button>
          <button class="chip" data-filter="offline">Offline</button>
          <button class="chip" data-filter="no response">No Response</button>
        </div>

        <div class="select-wrap">
          <label for="sortSelect" style="display:none;">Sort</label>
          <select id="sortSelect" aria-label="Sort players">
            <option value="power-desc">Sort: Strongest First</option>
            <option value="power-asc">Sort: Weakest First</option>
            <option value="group-average">Sort: Group Average</option>
            <option value="name">Sort: Name A–Z</option>
          </select>
        </div>
      </div>

      <div class="action-row">
        <button id="downloadCsv" class="button download-btn">Download CSV</button>
        <button id="printReport" class="button print-btn">Print Report</button>
      </div>
    </div>

    <div id="summary" class="summary-grid"></div>

    <div class="chart-grid">
      <div class="panel">
        <div class="panel-header">Top Power Players</div>
        <div id="leaderboard" class="leaderboard"></div>
      </div>
      <div class="panel">
        <div class="panel-header">Group Power Leaderboard</div>
        <div id="barChart" class="bar-chart"></div>
      </div>
    </div>

    <div id="report"></div>
  </div>

  <script>
    const csvUrl = 'current.csv';
    let currentFilter = 'all';
    let currentSort = 'power-desc';
    let allGroups = {};

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/).filter(line => line.trim() !== '');
      const rows = [];
      for (const line of lines) {
        const cells = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === ',' && !inQuotes) {
            cells.push(current);
            current = '';
          } else {
            current += ch;
          }
        }
        cells.push(current);
        rows.push(cells.map(cell => cell.trim()));
      }
      return rows;
    }

    function toNum(value) {
      const cleaned = String(value || '').replace(/[^0-9.-]/g, '');
      if (!cleaned) return null;
      const n = Number(cleaned);
      return Number.isFinite(n) ? n : null;
    }

    function normalizeStatus(value) {
      const s = String(value || '').trim().toLowerCase();
      if (!s) return 'unknown';
      if (s.includes('online')) return 'online';
      if (s.includes('offline')) return 'offline';
      if (s.includes('no response')) return 'no response';
      return 'unknown';
    }

    function getStatusClass(status) {
      const normalized = normalizeStatus(status);
      if (normalized === 'online') return 'online';
      if (normalized === 'offline' || normalized === 'no response') return 'offline';
      return 'unknown';
    }

    function statusLabel(status) {
      const normalized = normalizeStatus(status);
      if (normalized === 'online') return 'Online';
      if (normalized === 'offline') return 'Offline';
      if (normalized === 'no response') return 'No Response';
      return 'Unknown';
    }

    function filteredGroups() {
      const filtered = {};
      Object.entries(allGroups).forEach(([groupName, group]) => {
        const players = group.players.filter(player => {
          if (currentFilter === 'all') return true;
          const status = normalizeStatus(player['Online / Offline']);
          if (currentFilter === 'online') return status === 'online';
          if (currentFilter === 'offline') return status === 'offline' || status === 'no response';
          if (currentFilter === 'no response') return status === 'no response';
          return true;
        });

        if (players.length) {
          filtered[groupName] = { ...group, players };
        }
      });
      return filtered;
    }

    function sortPlayers(players) {
      const sorted = [...players];
      if (currentSort === 'power-desc') {
        return sorted.sort((a, b) => (toNum(b.Power) ?? -Infinity) - (toNum(a.Power) ?? -Infinity));
      }
      if (currentSort === 'power-asc') {
        return sorted.sort((a, b) => (toNum(a.Power) ?? Infinity) - (toNum(b.Power) ?? Infinity));
      }
      if (currentSort === 'group-average') {
        return sorted.sort((a, b) => {
          const groupA = allGroups[a.Group]?.avgPower ?? 0;
          const groupB = allGroups[b.Group]?.avgPower ?? 0;
          return groupB - groupA || ((toNum(b.Power) ?? -Infinity) - (toNum(a.Power) ?? -Infinity));
        });
      }
      if (currentSort === 'name') {
        return sorted.sort((a, b) => (a.Name || '').localeCompare(b.Name || ''));
      }
      return sorted;
    }

    function buildSummary(groups) {
      const totalGroups = Object.keys(groups).length;
      const totalPlayers = Object.values(groups).reduce((sum, group) => sum + group.players.length, 0);
      const onlinePlayers = Object.values(groups).reduce((sum, group) => {
        return sum + group.players.filter(player => normalizeStatus(player['Online / Offline']) === 'online').length;
      }, 0);

      const avgGroupPower = Object.values(groups).reduce((sum, group) => sum + (group.avgPower || 0), 0) / Math.max(totalGroups, 1);

      const summaryEl = document.getElementById('summary');
      summaryEl.innerHTML = `
        <div class="summary-card">
          <div class="label">Groups</div>
          <div class="value">${totalGroups}</div>
        </div>
        <div class="summary-card">
          <div class="label">Players</div>
          <div class="value">${totalPlayers}</div>
        </div>
        <div class="summary-card">
          <div class="label">Avg Group Power</div>
          <div class="value">${avgGroupPower.toFixed(1)}</div>
        </div>
        <div class="summary-card">
          <div class="label">Online</div>
          <div class="value">${onlinePlayers}</div>
        </div>
      `;
    }

    function renderLeaderboard(groups) {
      const leaderboardEl = document.getElementById('leaderboard');
      const allPlayers = [];
      Object.values(groups).forEach(group => {
        group.players.forEach(player => allPlayers.push(player));
      });

      const topPlayers = allPlayers
        .filter(player => toNum(player.Power) !== null)
        .sort((a, b) => (toNum(b.Power) ?? -Infinity) - (toNum(a.Power) ?? -Infinity))
        .slice(0, 8);

      leaderboardEl.innerHTML = topPlayers.length
        ? `<div class="leaderboard-list">${topPlayers.map((player, index) => `
            <div class="leader-item">
              <div class="rank-badge">${index + 1}</div>
              <div class="leader-name">${player.Name || 'Unknown'}</div>
              <div class="leader-power">${toNum(player.Power)?.toFixed(1) ?? '—'}</div>
            </div>
          `).join('')}</div>`
        : '<div class="empty-state">No players match the current filter.</div>';

      const barChartEl = document.getElementById('barChart');
      const groupLeaders = Object.entries(groups)
        .map(([groupName, group]) => ({ groupName, power: group.avgPower || 0 }))
        .sort((a, b) => b.power - a.power)
        .slice(0, 7);

      const maxGroupPower = Math.max(...groupLeaders.map(item => item.power), 1);

      barChartEl.innerHTML = groupLeaders.length
        ? groupLeaders.map(item => `
            <div class="chart-row">
              <div class="chart-label">${item.groupName}</div>
              <div class="bar-shell">
                <div class="bar-fill" style="width:${(item.power / maxGroupPower) * 100}%"></div>
              </div>
              <div class="chart-value">${item.power.toFixed(1)}</div>
            </div>
          `).join('')
        : '<div class="empty-state">No groups match the current filter.</div>';
    }

    function renderReport() {
      const groups = filteredGroups();

      buildSummary(groups);
      renderLeaderboard(groups);

      const reportEl = document.getElementById('report');
      const sortedGroups = Object.entries(groups).sort(([a], [b]) => a.localeCompare(b));

      reportEl.innerHTML = sortedGroups.map(([groupName, group]) => {
        const players = sortPlayers(group.players);
        group.avgPower = players.length
          ? players.reduce((sum, p) => sum + (toNum(p.Power) ?? 0), 0) / players.length
          : 0;

        const rowsHtml = players.map(player => {
          const status = statusLabel(player['Online / Offline']);
          const statusClass = getStatusClass(player['Online / Offline']);
          const power = toNum(player.Power);
          return `
            <tr>
              <td data-label="Name">${player.Name || '—'}</td>
              <td data-label="Rank"><span class="rank-bubble">${player.Rank || '—'}</span></td>
              <td data-label="Power">${power !== null ? power.toFixed(1) : '—'}</td>
              <td data-label="Marches">${player.Marches || '—'}</td>
              <td data-label="Status"><span class="${statusClass}">${status}</span></td>
            </tr>
          `;
        }).join('');

        return `
          <section class="group-block">
            <div class="group-header">
              <h2>${groupName}</h2>
              <span class="group-badge">Avg Power: ${group.avgPower ? group.avgPower.toFixed(1) : '—'}</span>
            </div>
            <div class="players-table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Rank</th>
                    <th>Power</th>
                    <th>Marches</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  ${rowsHtml || '<tr><td colspan="5" class="empty-state">No players</td></tr>'}
                </tbody>
              </table>
            </div>
          </section>
        `;
      }).join('') || '<div class="empty-state">No groups match the current filter.</div>';
    }

    function updateFilterButtons() {
      document.querySelectorAll('.chip').forEach(button => {
        button.classList.toggle('active', button.dataset.filter === currentFilter);
      });
    }

    function bindControls() {
      document.querySelectorAll('.chip').forEach(button => {
        button.addEventListener('click', () => {
          currentFilter = button.dataset.filter;
          updateFilterButtons();
          renderReport();
        });
      });

      document.getElementById('sortSelect').addEventListener('change', (event) => {
        currentSort = event.target.value;
        renderReport();
      });

      document.getElementById('downloadCsv').addEventListener('click', () => {
        const filteredRows = [];
        const groups = filteredGroups();
        Object.values(groups).forEach(group => {
          group.players.forEach(player => filteredRows.push(player));
        });

        const header = ['Group', 'Name', 'Rank', 'Power', 'Marches', 'Online / Offline', 'Average Group Power'];
        const csvRows = [header];

        filteredRows.forEach(player => {
          const average = (allGroups[player.Group]?.avgPower ?? 0).toFixed(1);
          csvRows.push([
            player.Group,
            player.Name,
            player.Rank,
            player.Power,
            player.Marches,
            player['Online / Offline'],
            average
          ]);
        });

        const csvContent = csvRows.map(row => row.map(value => `"${String(value ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'crazy-joe-105-filtered.csv';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      });

      document.getElementById('printReport').addEventListener('click', () => window.print());
    }

    async function loadData() {
      const response = await fetch(csvUrl);
      if (!response.ok) throw new Error('Unable to load CSV data');
      const text = await response.text();
      const rows = parseCSV(text);
      const header = rows[0] || [];
      const dataRows = rows.slice(1);

      const groups = {};
      dataRows.forEach(row => {
        if (!row || row.length < 7) return;
        const record = {};
        header.forEach((key, index) => {
          record[key] = row[index] || '';
        });

        const groupName = record.Group || 'Unknown';
        if (!groups[groupName]) {
          groups[groupName] = { players: [] };
        }

        groups[groupName].players.push(record);
      });

      Object.keys(groups).forEach(groupName => {
        const players = groups[groupName].players;
        const powers = players.map(player => toNum(player.Power)).filter(Number.isFinite);
        groups[groupName].avgPower = powers.length ? powers.reduce((sum, value) => sum + value, 0) / powers.length : 0;
      });

      allGroups = groups;
      renderReport();
      bindControls();
      updateFilterButtons();
    }

    loadData().catch(error => {
      console.error(error);
      document.getElementById('report').innerHTML = '<div class="empty-state" style="color:#ffb4b4;">Unable to load the report data.</div>';
    });
  </script>
</body>
</html>
