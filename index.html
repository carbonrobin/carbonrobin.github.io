<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarbonRobin</title>
    <style>
      :root {
        --bg: #0b0b0d;
        --panel: #111214;
        --ink: #f4f4f5;
        --muted: #a1a1aa;
        --line: rgba(255, 255, 255, 0.08);
        --soft: rgba(255, 255, 255, 0.02);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }

      .shell {
        width: min(760px, 100%);
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 48px 36px;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      .name {
        font-size: clamp(2.3rem, 7vw, 5rem);
        line-height: 0.9;
        letter-spacing: -0.07em;
        margin: 0;
      }

      .meta {
        color: var(--muted);
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .content {
        padding-top: 28px;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.8;
        max-width: 38rem;
      }

      .links {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .link {
        display: inline-block;
        padding: 8px 12px;
        border: 1px solid var(--line);
        color: var(--ink);
        text-decoration: none;
        background: var(--soft);
        font-size: 0.8rem;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="topline">
        <h1 class="name">CarbonRobin</h1>
        <div class="meta">Portfolio</div>
      </div>

      <div class="content">
        <p>
          Building, learning, and creating things online.
        </p>

        <div class="links">
          <a class="link" href="#about">About</a>
          <a class="link" href="#projects">Projects</a>
          <a class="link" href="#contact">Contact</a>
        </div>
      </div>
    </main>
  </body>
</html>
